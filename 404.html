<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Pagina per gli indirizzi che non esistono: Cloudflare Pages la mostra
     da sola con il codice 404 (prima rispondeva 200 con la homepage).
     Autonoma apposta: niente main.css, che nasconde il cursore di sistema
     aspettando quello disegnato dallo script della homepage. -->
<title>Pagina non trovata — Accademia del Gelato</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6E1E2A">
<link rel="icon" type="image/png" href="/assets/logo/favicon.png">
<script src="/js/avvio.js?v=14c0cf2b10"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;600&display=swap">
<style>
  :root {
    --rosso-accademia: #6E1E2A;
    --rosso-accent: #93283A;
    --rosso-scuro: #4A131C;
    --crema: #F8F1E4;
    --avorio: #FBF8F3;
    --beige-caldo: #E7DAC3;
    --antracite: #2A2521;
    --oro-tenue: #C6A468;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 48px 20px;
    background: var(--crema);
    color: var(--antracite);
    font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6;
  }
  main {
    width: 100%;
    max-width: 34rem;
    text-align: center;
  }
  .logo {
    display: inline-flex;
    flex-direction: column;
    gap: 0.2em;
    font-family: "Fraunces", Georgia, serif;
    font-size: 0.9rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--rosso-scuro);
    text-decoration: none;
    line-height: 1;
  }
  .codice {
    margin: 48px 0 8px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--rosso-accent);
  }
  h1 {
    margin: 0;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 500;
    font-size: clamp(2rem, 1.5rem + 2.5vw, 3rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--rosso-scuro);
    text-wrap: balance;
  }
  p { margin: 16px 0 0; }
  .inglese {
    margin-top: 6px;
    font-size: 0.875rem;
    opacity: 0.7;
  }
  .azioni {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 32px;
  }
  .azioni a {
    display: inline-flex;
    align-items: center;
    min-height: 48px;
    padding: 0 24px;
    border-radius: 999px;
    border: 1.5px solid var(--rosso-accademia);
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .azioni .primario { background: var(--rosso-accademia); color: var(--crema); }
  .azioni .primario:hover { background: var(--rosso-accent); border-color: var(--rosso-accent); }
  .azioni .secondario { color: var(--rosso-accademia); }
  .azioni .secondario:hover { background: var(--rosso-accademia); color: var(--crema); }
  a:focus-visible { outline: 2px solid var(--rosso-accademia); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .azioni a { transition: none; }
  }
</style>
</head>
<body>
<main>
  <a class="logo" href="/" aria-label="Accademia del Gelato — vai alla homepage">
    <span>Accademia</span>
    <span>del Gelato</span>
  </a>

  <p class="codice">Errore 404</p>
  <h1>Questa pagina non c'è</h1>
  <p>L'indirizzo che hai aperto non esiste o è stato spostato. I nostri gusti, però, sono tutti al loro posto.</p>
  <p class="inglese" lang="en">Page not found: the address you opened doesn't exist or has moved.</p>

  <div class="azioni">
    <a class="primario" href="/">Torna al sito</a>
    <a class="secondario" href="/#gusti">Scopri i gusti</a>
  </div>
</main>
</body>
</html>
