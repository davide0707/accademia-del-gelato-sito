<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pubblica — Accademia del Gelato</title>
<link rel="apple-touch-icon" href="../assets/logo/logo-gelato.png">
<link rel="icon" href="../assets/logo/logo-gelato.png">
<meta name="theme-color" content="#6E1E2A">
<style>
  :root {
    --rosso: #6E1E2A;
    --rosso-scuro: #4A131C;
    --crema: #F8F1E4;
    --avorio: #FBF8F3;
    --beige: #E7DAC3;
    --antracite: #2A2521;
    --verde-ok: #2F6B3F;
    --rosso-errore: #A5342A;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--crema);
    color: var(--antracite);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  header img { width: 40px; height: auto; }
  header h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    line-height: 1.25;
  }
  header p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--rosso);
    opacity: 0.8;
  }

  main { flex: 1; display: flex; flex-direction: column; }

  .schermata { display: none; flex-direction: column; gap: 18px; }
  .schermata.attiva { display: flex; }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--rosso-scuro);
    margin-bottom: 6px;
  }
  .label-facoltativo { font-weight: 400; opacity: 0.6; }

  input[type="text"],
  input[type="password"],
  textarea {
    width: 100%;
    font-size: 16px;
    font-family: inherit;
    padding: 13px 14px;
    border: 1.5px solid var(--beige);
    border-radius: 12px;
    background: var(--avorio);
    color: var(--antracite);
    outline: none;
    transition: border-color 0.15s ease;
  }
  input[type="text"]:focus,
  input[type="password"]:focus,
  textarea:focus { border-color: var(--rosso); }

  textarea { resize: none; min-height: 96px; line-height: 1.45; }

  .contatore {
    text-align: right;
    font-size: 12px;
    color: var(--antracite);
    opacity: 0.55;
    margin-top: 4px;
  }
  .contatore.limite { color: var(--rosso-errore); opacity: 1; }

  .foto-picker {
    display: block;
    border: 1.5px dashed var(--beige);
    border-radius: 14px;
    background: var(--avorio);
    padding: 18px;
    text-align: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    min-height: 120px;
  }
  .foto-picker input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .foto-picker__testo { font-size: 14px; color: var(--rosso); font-weight: 600; }
  .foto-picker__anteprima {
    display: none;
    width: 100%;
    max-height: 260px;
    object-fit: cover;
    border-radius: 10px;
  }
  .foto-picker.ha-foto .foto-picker__testo { display: none; }
  .foto-picker.ha-foto .foto-picker__anteprima { display: block; }

  .pin-wrap { display: flex; gap: 8px; }
  .pin-wrap input { letter-spacing: 4px; font-size: 20px; text-align: center; }

  button {
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 999px;
    padding: 16px;
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-primario { background: var(--rosso); color: var(--crema); }
  .btn-secondario { background: transparent; color: var(--rosso); font-size: 13px; padding: 8px; }

  .messaggio {
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 10px;
    display: none;
  }
  .messaggio.visibile { display: block; }
  .messaggio.errore { background: rgb(165 52 42 / 10%); color: var(--rosso-errore); }

  .schermata.esito {
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 14px;
  }
  .esito__cerchio {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--verde-ok);
    color: var(--crema);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }
  .esito h2 { margin: 0; font-size: 18px; }
  .esito p { margin: 0; font-size: 14px; opacity: 0.7; max-width: 26ch; }

  .spinner {
    width: 18px; height: 18px;
    border: 2.5px solid rgb(248 241 228 / 40%);
    border-top-color: var(--crema);
    border-radius: 50%;
    animation: girare 0.7s linear infinite;
    display: inline-block;
    vertical-align: -3px;
    margin-right: 8px;
  }
  @keyframes girare { to { transform: rotate(360deg); } }

  .link-indietro {
    align-self: flex-start;
    background: none;
    border: none;
    padding: 4px 0;
    font-size: 14px;
    font-weight: 600;
    color: var(--rosso);
    cursor: pointer;
  }

  .gestione__titolo { margin: 0; font-size: 16px; font-weight: 700; }
  .gestione__sottotitolo { margin: 4px 0 0; font-size: 13px; opacity: 0.65; }

  .gestione__lista {
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
  }

  .gestione__caricamento,
  .gestione__vuoto {
    text-align: center;
    font-size: 13px;
    opacity: 0.55;
    padding: 24px 0;
  }

  .gestione__voce {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    background: var(--avorio);
    border: 1px solid var(--beige);
    border-radius: 12px;
  }
  .gestione__voce[hidden] { display: none; }

  .gestione__voce-foto {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--beige);
    flex-shrink: 0;
  }

  .gestione__voce-testo { flex: 1; min-width: 0; }
  .gestione__voce-titolo {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .gestione__voce-data { font-size: 12px; opacity: 0.55; margin-top: 2px; }

  .gestione__voce-cancella {
    flex-shrink: 0;
    background: none;
    border: 1.5px solid var(--rosso-errore);
    color: var(--rosso-errore);
    font-size: 12px;
    font-weight: 700;
    padding: 8px 12px;
    border-radius: 999px;
  }
  .gestione__voce-cancella:disabled { opacity: 0.5; }
</style>
</head>
<body>

<header>
  <img src="../assets/logo/logo-gelato.png" alt="">
  <div>
    <h1>Accademia del Gelato</h1>
    <p>Pubblica un aggiornamento</p>
  </div>
</header>

<main>

  <!-- SCHERMATA PIN -->
  <section class="schermata attiva" id="schermata-pin">
    <div>
      <label for="campo-pin">PIN</label>
      <div class="pin-wrap">
        <input type="password" id="campo-pin" autocomplete="off" placeholder="Il tuo PIN" maxlength="40">
      </div>
    </div>
    <p class="messaggio errore" id="errore-pin"></p>
    <button class="btn-primario" id="btn-sblocca">Sblocca</button>
  </section>

  <!-- SCHERMATA MODULO -->
  <section class="schermata" id="schermata-modulo">
    <div>
      <label for="campo-titolo">Titolo</label>
      <input type="text" id="campo-titolo" maxlength="60" placeholder="Es. Il pistacchio di questa settimana">
      <div class="contatore" id="contatore-titolo">0 / 60</div>
    </div>

    <div>
      <label>Foto <span class="label-facoltativo">(facoltativa)</span></label>
      <label class="foto-picker" id="foto-picker">
        <span class="foto-picker__testo">Tocca per scattare o scegliere una foto</span>
        <img class="foto-picker__anteprima" id="foto-anteprima" alt="">
        <input type="file" accept="image/*" capture id="campo-foto">
      </label>
    </div>

    <div>
      <label for="campo-testo">Testo</label>
      <textarea id="campo-testo" maxlength="240" placeholder="Due o tre righe, come le diresti al bancone."></textarea>
      <div class="contatore" id="contatore-testo">0 / 240</div>
    </div>

    <p class="messaggio errore" id="errore-modulo"></p>

    <button class="btn-primario" id="btn-pubblica">Pubblica</button>
    <button class="btn-secondario" id="btn-gestisci">Gestisci aggiornamenti pubblicati</button>
  </section>

  <!-- SCHERMATA ESITO -->
  <section class="schermata esito" id="schermata-esito">
    <div class="esito__cerchio" id="esito-icona">✓</div>
    <h2 id="esito-titolo">Pubblicato</h2>
    <p id="esito-testo">Sarà visibile sul sito tra pochi secondi.</p>
    <button class="btn-primario" id="btn-nuovo">Scrivi un altro aggiornamento</button>
    <button class="btn-secondario" id="btn-gestisci-da-esito">Gestisci aggiornamenti pubblicati</button>
  </section>

  <!-- SCHERMATA GESTIONE (cancellazione) -->
  <section class="schermata" id="schermata-gestione">
    <button class="link-indietro" id="btn-indietro-gestione" type="button">← Torna a pubblica</button>
    <div>
      <p class="gestione__titolo">I tuoi aggiornamenti</p>
      <p class="gestione__sottotitolo">Tocca "Cancella" per rimuovere un aggiornamento dal sito.</p>
    </div>
    <input type="text" id="gestione-cerca" placeholder="Cerca per titolo o testo…" autocomplete="off">
    <p class="messaggio errore" id="errore-gestione"></p>
    <div class="gestione__lista" id="gestione-lista">
      <p class="gestione__caricamento">Carico…</p>
    </div>
  </section>

</main>

<script>
(() => {
  const PIN_KEY = 'ag_roberto_pin';
  const TITOLO_MAX = 60;
  const TESTO_MAX = 240;
  const LATO_MAX_PX = 1600;
  const QUALITA_JPEG = 0.82;
  const SANITY_PROJECT_ID = 'jskwy1n7';
  const SANITY_DATASET = 'production';

  const $ = (id) => document.getElementById(id);
  const schermate = {
    pin: $('schermata-pin'),
    modulo: $('schermata-modulo'),
    esito: $('schermata-esito'),
    gestione: $('schermata-gestione'),
  };
  function mostra(nome) {
    Object.values(schermate).forEach((el) => el.classList.remove('attiva'));
    schermate[nome].classList.add('attiva');
  }

  // ---- Schermata PIN ----
  const campoPin = $('campo-pin');
  const erroreePin = $('errore-pin');
  const btnSblocca = $('btn-sblocca');

  function pinSalvato() {
    return localStorage.getItem(PIN_KEY);
  }

  // Il PIN viene sempre verificato lato server prima di mostrare il modulo:
  // uno sbagliato non deve mai far vedere la pagina di pubblicazione, nè ora
  // nè su una visita successiva con un PIN salvato che nel frattempo è
  // cambiato (es. ruotato dal proprietario del sito).
  async function verificaEProsegui(valore, { silenzioso = false } = {}) {
    if (!silenzioso) {
      btnSblocca.disabled = true;
      btnSblocca.innerHTML = '<span class="spinner"></span>Verifico…';
    }
    try {
      const risposta = await fetch('/api/verifica-pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: valore }),
      });
      if (risposta.ok) {
        localStorage.setItem(PIN_KEY, valore);
        erroreePin.classList.remove('visibile');
        mostra('modulo');
        return;
      }
      localStorage.removeItem(PIN_KEY);
      if (!silenzioso) {
        erroreePin.textContent = 'PIN errato.';
        erroreePin.classList.add('visibile');
      }
    } catch (e) {
      if (!silenzioso) {
        erroreePin.textContent = 'Non riesco a verificare il PIN — controlla la connessione.';
        erroreePin.classList.add('visibile');
      }
    } finally {
      btnSblocca.disabled = false;
      btnSblocca.textContent = 'Sblocca';
    }
  }

  btnSblocca.addEventListener('click', () => {
    const valore = campoPin.value.trim();
    if (!valore) {
      erroreePin.textContent = 'Inserisci il PIN.';
      erroreePin.classList.add('visibile');
      return;
    }
    verificaEProsegui(valore);
  });

  // se il PIN è già salvato da una visita precedente, lo riverifica in
  // silenzio: se è ancora corretto salta la schermata, altrimenti resta
  // sulla schermata PIN pronta per un nuovo tentativo
  if (pinSalvato()) verificaEProsegui(pinSalvato(), { silenzioso: true });

  // ---- Schermata modulo ----
  const campoTitolo = $('campo-titolo');
  const campoTesto = $('campo-testo');
  const campoFoto = $('campo-foto');
  const fotoPicker = $('foto-picker');
  const fotoAnteprima = $('foto-anteprima');
  const contatoreTitolo = $('contatore-titolo');
  const contatoreTesto = $('contatore-testo');
  const erroreModulo = $('errore-modulo');
  const btnPubblica = $('btn-pubblica');

  let fotoCompressaDataUrl = null;

  campoTitolo.addEventListener('input', () => {
    contatoreTitolo.textContent = `${campoTitolo.value.length} / ${TITOLO_MAX}`;
    contatoreTitolo.classList.toggle('limite', campoTitolo.value.length >= TITOLO_MAX);
  });

  campoTesto.addEventListener('input', () => {
    contatoreTesto.textContent = `${campoTesto.value.length} / ${TESTO_MAX}`;
    contatoreTesto.classList.toggle('limite', campoTesto.value.length >= TESTO_MAX);
  });

  function comprimiFoto(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = (e) => { img.src = e.target.result; };
      reader.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > LATO_MAX_PX) {
          height = Math.round((height * LATO_MAX_PX) / width);
          width = LATO_MAX_PX;
        } else if (height > LATO_MAX_PX) {
          width = Math.round((width * LATO_MAX_PX) / height);
          height = LATO_MAX_PX;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', QUALITA_JPEG));
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  campoFoto.addEventListener('change', async () => {
    const file = campoFoto.files[0];
    if (!file) return;
    erroreModulo.classList.remove('visibile');
    try {
      fotoCompressaDataUrl = await comprimiFoto(file);
      fotoAnteprima.src = fotoCompressaDataUrl;
      fotoPicker.classList.add('ha-foto');
    } catch (e) {
      erroreModulo.textContent = 'Non sono riuscito a leggere questa foto. Riprova.';
      erroreModulo.classList.add('visibile');
    }
  });

  function mostraErroreModulo(testo) {
    erroreModulo.textContent = testo;
    erroreModulo.classList.add('visibile');
  }

  btnPubblica.addEventListener('click', async () => {
    erroreModulo.classList.remove('visibile');

    const titolo = campoTitolo.value.trim();
    const testo = campoTesto.value.trim();

    if (!titolo) return mostraErroreModulo('Manca il titolo.');
    if (!testo) return mostraErroreModulo('Manca il testo.');

    if (!fotoCompressaDataUrl) {
      const confermato = confirm('Vuoi pubblicare senza foto?');
      if (!confermato) return;
    }

    btnPubblica.disabled = true;
    btnPubblica.innerHTML = '<span class="spinner"></span>Pubblico…';

    try {
      const risposta = await fetch('/api/pubblica', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          pin: pinSalvato(),
          titolo,
          testo,
          fotoBase64: fotoCompressaDataUrl,
        }),
      });

      const dati = await risposta.json().catch(() => ({}));

      if (risposta.status === 401) {
        localStorage.removeItem(PIN_KEY);
        mostra('pin');
        erroreePin.textContent = 'PIN errato — inseriscilo di nuovo.';
        erroreePin.classList.add('visibile');
        return;
      }

      if (!risposta.ok) {
        throw new Error(dati.errore || 'Errore sconosciuto');
      }

      // reset del modulo per il prossimo post
      campoTitolo.value = '';
      campoTesto.value = '';
      fotoCompressaDataUrl = null;
      fotoPicker.classList.remove('ha-foto');
      contatoreTitolo.textContent = `0 / ${TITOLO_MAX}`;
      contatoreTesto.textContent = `0 / ${TESTO_MAX}`;

      mostra('esito');
    } catch (err) {
      mostraErroreModulo(err.message || 'Qualcosa è andato storto. Riprova.');
    } finally {
      btnPubblica.disabled = false;
      btnPubblica.textContent = 'Pubblica';
    }
  });

  $('btn-nuovo').addEventListener('click', () => mostra('modulo'));

  // ---- Schermata gestione (cancellazione + ricerca) ----
  const listaGestione = $('gestione-lista');
  const erroreGestione = $('errore-gestione');
  const campoCercaGestione = $('gestione-cerca');

  function formattaDataBreve(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  async function caricaGestione() {
    erroreGestione.classList.remove('visibile');
    listaGestione.innerHTML = '<p class="gestione__caricamento">Carico…</p>';
    try {
      const query = encodeURIComponent(
        `*[_type == "aggiornamento"] | order(pubblicatoIl desc){_id, titolo, testo, pubblicatoIl, "fotoUrl": foto.asset->url}`
      );
      const url = `https://${SANITY_PROJECT_ID}.apicdn.sanity.io/v2024-01-01/data/query/${SANITY_DATASET}?query=${query}`;
      const risposta = await fetch(url);
      if (!risposta.ok) throw new Error('risposta non ok');
      const { result } = await risposta.json();
      renderizzaGestione(result || []);
    } catch (e) {
      listaGestione.innerHTML = '';
      erroreGestione.textContent = 'Non riesco a caricare gli aggiornamenti. Riprova.';
      erroreGestione.classList.add('visibile');
    }
  }

  function renderizzaGestione(posts) {
    listaGestione.innerHTML = '';
    campoCercaGestione.value = '';
    if (posts.length === 0) {
      listaGestione.innerHTML = '<p class="gestione__vuoto">Non hai ancora pubblicato nessun aggiornamento.</p>';
      return;
    }
    posts.forEach((post) => listaGestione.appendChild(creaVoceGestione(post)));
  }

  campoCercaGestione.addEventListener('input', () => {
    const query = campoCercaGestione.value.trim().toLowerCase();
    const voci = listaGestione.querySelectorAll('.gestione__voce');
    let visibili = 0;
    voci.forEach((voce) => {
      const corrisponde = !query || voce.dataset.ricerca.includes(query);
      voce.hidden = !corrisponde;
      if (corrisponde) visibili += 1;
    });
    let nessunRisultato = listaGestione.querySelector('.gestione__vuoto');
    if (voci.length > 0 && visibili === 0) {
      if (!nessunRisultato) {
        nessunRisultato = document.createElement('p');
        nessunRisultato.className = 'gestione__vuoto';
        nessunRisultato.textContent = 'Nessun aggiornamento corrisponde alla ricerca.';
        listaGestione.appendChild(nessunRisultato);
      }
    } else if (nessunRisultato) {
      nessunRisultato.remove();
    }
  });

  function creaVoceGestione(post) {
    const voce = document.createElement('div');
    voce.className = 'gestione__voce';
    voce.dataset.ricerca = `${post.titolo || ''} ${post.testo || ''}`.toLowerCase();

    const foto = document.createElement('img');
    foto.className = 'gestione__voce-foto';
    if (post.fotoUrl) foto.src = `${post.fotoUrl}?w=96&auto=format&fit=max`;
    voce.appendChild(foto);

    const testo = document.createElement('div');
    testo.className = 'gestione__voce-testo';
    const titolo = document.createElement('div');
    titolo.className = 'gestione__voce-titolo';
    titolo.textContent = post.titolo;
    const data = document.createElement('div');
    data.className = 'gestione__voce-data';
    data.textContent = formattaDataBreve(post.pubblicatoIl);
    testo.append(titolo, data);
    voce.appendChild(testo);

    const btnCancella = document.createElement('button');
    btnCancella.type = 'button';
    btnCancella.className = 'gestione__voce-cancella';
    btnCancella.textContent = 'Cancella';
    btnCancella.addEventListener('click', () => cancellaAggiornamento(post._id, post.titolo, voce, btnCancella));
    voce.appendChild(btnCancella);

    return voce;
  }

  async function cancellaAggiornamento(id, titolo, voceEl, btnEl) {
    if (!confirm(`Cancellare "${titolo}"? Non si può annullare.`)) return;

    btnEl.disabled = true;
    btnEl.textContent = '…';
    erroreGestione.classList.remove('visibile');

    try {
      const risposta = await fetch('/api/cancella', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: pinSalvato(), id }),
      });

      if (risposta.status === 401) {
        localStorage.removeItem(PIN_KEY);
        mostra('pin');
        erroreePin.textContent = 'PIN errato — inseriscilo di nuovo.';
        erroreePin.classList.add('visibile');
        return;
      }

      const dati = await risposta.json().catch(() => ({}));
      if (!risposta.ok) throw new Error(dati.errore || 'Errore sconosciuto');

      voceEl.remove();
      if (!listaGestione.querySelector('.gestione__voce')) {
        listaGestione.innerHTML = '<p class="gestione__vuoto">Non hai ancora pubblicato nessun aggiornamento.</p>';
      }
    } catch (e) {
      btnEl.disabled = false;
      btnEl.textContent = 'Cancella';
      erroreGestione.textContent = e.message || 'Non sono riuscito a cancellarlo. Riprova.';
      erroreGestione.classList.add('visibile');
    }
  }

  function apriGestione() {
    mostra('gestione');
    caricaGestione();
  }

  $('btn-gestisci').addEventListener('click', apriGestione);
  $('btn-gestisci-da-esito').addEventListener('click', apriGestione);
  $('btn-indietro-gestione').addEventListener('click', () => mostra('modulo'));
})();
</script>

</body>
</html>
